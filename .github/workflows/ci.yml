name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint and formatting
            command: pnpm run lint && pnpm run format:check
          - name: Typecheck
            command: pnpm run typecheck
          - name: Tests and coverage
            command: pnpm run test:coverage
          - name: Build
            command: pnpm run build
    services:
      postgres:
        image: ${{ matrix.name == 'Tests and coverage' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run check
        run: ${{ matrix.command }}
        env:
          # Disposable test database and build-only auth placeholders.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DATABASE_TEST_URL: postgresql://ci:ci@localhost:5432/ci_test
          BETTER_AUTH_SECRET: ci-only-secret-not-for-deployment-0123456789
          BETTER_AUTH_GITHUB_CLIENT_ID: ci-placeholder
          BETTER_AUTH_GITHUB_CLIENT_SECRET: ci-placeholder
          BETTER_AUTH_URL: http://localhost:3000
      - name: Upload coverage
        if: ${{ always() && matrix.name == 'Tests and coverage' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn
